<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-label="Hint browsing branches into a side-conversation; only selected hints rejoin the main run">
<style>
.t{font-family:Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;fill:#3a4a58;font-size:12px}
.m{font-family:'JetBrains Mono', ui-monospace, Menlo, monospace;fill:#6a7987;font-size:12px}
.h{paint-order:stroke;stroke:#ffffff;stroke-width:4px;stroke-linejoin:round}
.lab{fill:#6a7987}
.strong{fill:#17212b;font-weight:600}
.grid{stroke:#e4e8ec;stroke-width:1}
.axis{stroke:#cfd6dc;stroke-width:1}
.step{fill:none;stroke:#0e6f88;stroke-width:2.25;stroke-linejoin:round;stroke-linecap:round}
.num{font-family:Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;font-weight:600;fill:#ffffff;text-anchor:middle}
.numw{fill:#b9536b}
</style>
<rect width="900" height="440" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#0e6f88"/></marker><marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#93a1ad"/></marker></defs>
<rect x="32" y="48" width="168" height="56" rx="8" fill="#e6f2f5" stroke="#0e6f88" stroke-width="1"/>
<text x="116.0" y="70.0" class="t strong" text-anchor="middle" font-size="13">Main run</text>
<text x="116.0" y="88.0" class="t" text-anchor="middle" font-size="12">model + context</text>
<path d="M200,76 H246" fill="none" stroke="#0e6f88" stroke-width="1.75" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="248" y="48" width="200" height="56" rx="8" fill="#e6f2f5" stroke="#0e6f88" stroke-width="1"/>
<text x="348.0" y="70.0" class="m strong" text-anchor="middle" font-size="12">browse_hints()</text>
<text x="348.0" y="88.0" class="t" text-anchor="middle" font-size="12">tool call</text>
<path d="M448,76 H698" fill="none" stroke="#0e6f88" stroke-width="1.75" stroke-linejoin="round" marker-end="url(#a)"/>
<text x="573.0" y="68.0" class="t lab h" text-anchor="middle" font-size="12">main context retained unchanged</text>
<rect x="700" y="48" width="168" height="56" rx="8" fill="#e6f2f5" stroke="#0e6f88" stroke-width="1"/>
<text x="784.0" y="70.0" class="t strong" text-anchor="middle" font-size="13">Main run resumes</text>
<text x="784.0" y="88.0" class="t" text-anchor="middle" font-size="12">selected hints applied</text>
<path d="M348,104 V188" fill="none" stroke="#0e6f88" stroke-width="1.75" stroke-linejoin="round" marker-end="url(#a)"/>
<text x="360.0" y="150.0" class="t lab" text-anchor="start" font-size="12">copy of model + context</text>
<rect x="248" y="190" width="312" height="136" rx="8" fill="#ffffff" stroke="#6a7987" stroke-width="1" stroke-dasharray="4 3"/>
<text x="404.0" y="234.0" class="t strong" text-anchor="middle" font-size="13">Side-conversation</text>
<text x="404.0" y="252.0" class="t lab" text-anchor="middle" font-size="12">reads the full text of every hint,</text>
<text x="404.0" y="270.0" class="t lab" text-anchor="middle" font-size="12">with its price, and decides</text>
<text x="404.0" y="288.0" class="t lab" text-anchor="middle" font-size="12">which hints to keep</text>
<path d="M560,216 H784 V106" fill="none" stroke="#0e6f88" stroke-width="1.75" stroke-linejoin="round" marker-end="url(#a)"/>
<text x="672.0" y="206.0" class="t h" text-anchor="middle" font-size="12">selected hints only</text>
<path d="M404,326 V370" fill="none" stroke="#93a1ad" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ad)"/>
<rect x="274" y="372" width="260" height="46" rx="8" fill="#f4f5f6" stroke="#cfd6dc" stroke-width="1" stroke-dasharray="4 3"/>
<text x="404.0" y="389.0" class="t strong" text-anchor="middle" font-size="13">Discarded</text>
<text x="404.0" y="407.0" class="t lab" text-anchor="middle" font-size="12">preview and rejected hints</text>
<rect x="600" y="250" width="268" height="90" rx="8" fill="#ffffff" stroke="#e4e8ec"/>
<text x="614.0" y="272.0" class="t strong" text-anchor="start" font-size="12">Example: keep a ×0.9 hint</text>
<text x="614.0" y="296.0" class="t lab" text-anchor="start" font-size="12">Earlier best</text>
<text x="854.0" y="296.0" class="t" text-anchor="end" font-size="12" xml:space="preserve"><tspan class="m">0.35</tspan><tspan class="t lab"> → </tspan><tspan class="m strong">0.35</tspan><tspan class="t lab">  unchanged</tspan></text>
<text x="614.0" y="320.0" class="t lab" text-anchor="start" font-size="12">Later submission</text>
<text x="854.0" y="320.0" class="t" text-anchor="end" font-size="12" xml:space="preserve"><tspan class="m">0.80</tspan><tspan class="t lab"> → </tspan><tspan class="m strong">0.72</tspan><tspan class="t lab">  ×0.9</tspan></text>
</svg>
