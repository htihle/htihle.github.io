<line x1="234.0" y1="242" x2="234.0" y2="247" class="axis"/>
<text x="234.0" y="266.0" class="m" text-anchor="middle" font-size="12">5M</text>
<line x1="346.0" y1="242" x2="346.0" y2="247" class="axis"/>
