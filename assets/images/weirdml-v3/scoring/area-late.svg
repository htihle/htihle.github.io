<text x="38.0" y="195.8" class="m" text-anchor="end" font-size="12">.25</text>
<line x1="48" y1="141.0" x2="420" y2="141.0" class="grid"/>
<text x="38.0" y="145.3" class="m" text-anchor="end" font-size="12">.50</text>
