<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 652" role="img" aria-label="Hint browsing branches into a side-conversation; only selected hints rejoin the main run">
<style>
.t{font-family:Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;fill:#3a4a58;font-size:12px}
.m{font-family:'JetBrains Mono', ui-monospace, Menlo, monospace;fill:#6a7987;font-size:12px}
.h{paint-order:stroke;stroke:#ffffff;stroke-width:4px;stroke-linejoin:round}
.lab{fill:#6a7987}
.strong{fill:#17212b;font-weight:600}
.grid{stroke:#e4e8ec;stroke-width:1}
.axis{stroke:#cfd6dc;stroke-width:1}
.step{fill:none;stroke:#0e6f88;stroke-width:2.25;stroke-linejoin:round;stroke-linecap:round}
.num{font-family:Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;font-weight:600;fill:#ffffff;text-anchor:middle}
.numw{fill:#b9536b}
</style>
<rect width="420" height="652" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#0e6f88"/></marker><marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#93a1ad"/></marker></defs>
<rect x="60" y="20" width="300" height="56" rx="8" fill="#e6f2f5" stroke="#0e6f88" stroke-width="1"/>
<text x="210.0" y="42.0" class="t strong" text-anchor="middle" font-size="14">Main run</text>
<text x="210.0" y="61.0" class="t" text-anchor="middle" font-size="13">model + context</text>
<path d="M210.0,76 V104" fill="none" stroke="#0e6f88" stroke-width="1.75" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="60" y="106" width="300" height="56" rx="8" fill="#e6f2f5" stroke="#0e6f88" stroke-width="1"/>
<text x="210.0" y="128.0" class="m strong" text-anchor="middle" font-size="13">browse_hints()</text>
<text x="210.0" y="147.0" class="t" text-anchor="middle" font-size="13">tool call</text>
<path d="M210.0,162 V214" fill="none" stroke="#0e6f88" stroke-width="1.75" stroke-linejoin="round" marker-end="url(#a)"/>
<text x="222.0" y="193.0" class="t lab" text-anchor="start" font-size="13">copy of model + context</text>
<rect x="40" y="216" width="340" height="132" rx="8" fill="#ffffff" stroke="#6a7987" stroke-width="1" stroke-dasharray="4 3"/>
<text x="210.0" y="257.0" class="t strong" text-anchor="middle" font-size="14">Side-conversation</text>
<text x="210.0" y="276.0" class="t lab" text-anchor="middle" font-size="13">reads the full text of every hint,</text>
<text x="210.0" y="295.0" class="t lab" text-anchor="middle" font-size="13">with its price, and decides</text>
<text x="210.0" y="314.0" class="t lab" text-anchor="middle" font-size="13">which hints to keep</text>
<path d="M120,348 V420" fill="none" stroke="#93a1ad" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ad)"/>
<rect x="24" y="422" width="186" height="72" rx="8" fill="#f4f5f6" stroke="#cfd6dc" stroke-width="1" stroke-dasharray="4 3"/>
<text x="117.0" y="442.5" class="t strong" text-anchor="middle" font-size="14">Discarded</text>
<text x="117.0" y="461.5" class="t lab" text-anchor="middle" font-size="13">preview and</text>
<text x="117.0" y="480.5" class="t lab" text-anchor="middle" font-size="13">rejected hints</text>
<path d="M300,348 V420" fill="none" stroke="#0e6f88" stroke-width="1.75" stroke-linejoin="round" marker-end="url(#a)"/>
<text x="312.0" y="390.0" class="t h" text-anchor="start" font-size="13">selected</text>
<text x="312.0" y="407.0" class="t h" text-anchor="start" font-size="13">hints only</text>
<rect x="226" y="422" width="170" height="72" rx="8" fill="#e6f2f5" stroke="#0e6f88" stroke-width="1"/>
<text x="311.0" y="442.5" class="t strong" text-anchor="middle" font-size="14">Main run</text>
<text x="311.0" y="461.5" class="t" text-anchor="middle" font-size="13">resumes with</text>
<text x="311.0" y="480.5" class="t" text-anchor="middle" font-size="13">selected hints</text>
<rect x="24" y="540" width="372" height="92" rx="8" fill="#ffffff" stroke="#e4e8ec"/>
<text x="38.0" y="562.0" class="t strong" text-anchor="start" font-size="13">Example: keep a ×0.9 hint</text>
<text x="38.0" y="587.0" class="t lab" text-anchor="start" font-size="13">Earlier best</text>
<text x="382.0" y="587.0" class="t" text-anchor="end" font-size="13" xml:space="preserve"><tspan class="m">0.35</tspan><tspan class="t lab"> → </tspan><tspan class="m strong">0.35</tspan><tspan class="t lab">  unchanged</tspan></text>
<text x="38.0" y="612.0" class="t lab" text-anchor="start" font-size="13">Later submission</text>
<text x="382.0" y="612.0" class="t" text-anchor="end" font-size="13" xml:space="preserve"><tspan class="m">0.80</tspan><tspan class="t lab"> → </tspan><tspan class="m strong">0.72</tspan><tspan class="t lab">  ×0.9</tspan></text>
</svg>
